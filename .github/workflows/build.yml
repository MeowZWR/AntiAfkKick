name: .NET Build

on:
  push:
    branches: '*'
    tags-ignore: '*'
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: recursive
      - name: Setup .NET
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: '9.x.x'
      - name: Restore dependencies
        run: dotnet restore AntiAfkKick-Dalamud/AntiAfkKick-Dalamud.csproj
      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/stg/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev\"
      - name: Build
        run: |
          dotnet build AntiAfkKick-Dalamud/AntiAfkKick-Dalamud.csproj --no-restore --configuration Release --nologo
      - name: Archive
        run: Compress-Archive -Path AntiAfkKick-Dalamud/bin/Release/* -DestinationPath AntiAfkKick-Dalamud.zip
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          path: |
            ./AntiAfkKick-Dalamud/bin/Release/*
